<!doctype html>
<html lang="fr">
<head>
<title>Arthur Mandio</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@600&display=swap">
<style>
/* Layout: une colonne centrée, vidéo verticale d'abord, formulaire de rendez-vous en dessous. Identité reprise de la vidéo : fond presque noir, orange ENSPY. */
:root{
  --bg:#0b0908; --card:#1a1411; --line:#33291f; --fg:#f6f2ee; --mut:#a89d92;
  --accent:#fc7d08; --ink:#14100c;
  --display:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'DejaVu Sans Mono',monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:400 16px/1.5 var(--display);margin:0;
  padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font:600 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.brand b{color:var(--accent);font-weight:600}
.ctrl{display:flex;gap:8px}
.sm{background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:99px;padding:8px 14px;
  font:600 12px var(--mono);letter-spacing:.06em;cursor:pointer;min-height:36px}
.sm:hover{border-color:var(--accent)}
.sm:focus-visible,.go:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible,video:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stage{display:flex;flex-direction:column;gap:14px;align-items:center}
video{width:100%;max-width:340px;aspect-ratio:9/16;background:#000;border-radius:28px;border:1px solid var(--line);display:block}
.cap{font:600 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin:0;text-align:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:26px;display:flex;flex-direction:column;gap:6px}
.pill{align-self:flex-start;font:600 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);border-radius:99px;padding:5px 11px}
h1{font:800 28px/1.15 var(--display);margin:12px 0 4px;text-wrap:balance}
h1 em{font-style:normal;color:var(--accent)}
.sub{color:var(--mut);margin:0 0 10px;font-size:15px;text-wrap:pretty}
label{display:block;font:600 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin:14px 0 6px}
input,textarea{width:100%;background:#120d0a;border:1px solid var(--line);border-radius:12px;color:var(--fg);padding:13px 14px;font:inherit;font-size:16px}
textarea{resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row>div{min-width:0}
.go{display:block;text-align:center;text-decoration:none;margin-top:22px;background:var(--accent);color:var(--ink);border-radius:14px;padding:15px;font:800 15px var(--display);letter-spacing:.02em}
.go:hover{filter:brightness(1.07)}
.err{color:#ff9a6b;font-size:14px;min-height:20px;margin:10px 0 0}
.help{text-align:center;color:var(--mut);font-size:14px;margin:0}
.help a{color:var(--accent)}
.num{font:600 13px var(--mono);color:var(--fg);user-select:all}
.copy{margin-left:8px}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

</head>
<body>
<div class="wrap">
  <div class="top">
    <span class="brand"><b>AM</b> · ENSPY</span>
    <div class="ctrl">
      <button class="sm" id="music" type="button"></button>
      <button class="sm" id="lang" type="button" aria-label="Changer de langue / Switch language"></button>
    </div>
  </div>

  <section class="stage">
    <video id="vid" controls playsinline preload="metadata" src="Arthur_Mandio_fr.mp4"></video>
    <p class="cap" id="cap"></p>
  </section>

  <section class="card">
    <span class="pill" id="pill"></span>
    <h1 id="title"></h1>
    <p class="sub" id="sub"></p>
    <form id="f" novalidate>
      <label id="lName" for="name"></label>
      <input id="name" autocomplete="name">
      <div class="row">
        <div><label id="lDate" for="date"></label><input id="date" type="date"></div>
        <div><label id="lTime" for="time"></label><input id="time" type="time"></div>
      </div>
      <label id="lMsg" for="msg"></label>
      <textarea id="msg" rows="3"></textarea>
      <a class="go" id="send" href="#" target="_blank" rel="noopener"></a>
      <p class="err" id="err" role="alert"></p>
    </form>
    <p class="help"><span id="helpTxt"></span> <span class="num" id="num">+237 698 636 766</span>
      <button class="sm copy" id="copy" type="button"></button></p>
  </section>
  <p class="help" id="ask"></p>
</div>

<script>
// Numéro WhatsApp qui reçoit les rendez-vous (format international, sans + ni espaces)
var WA = "237698636766", WA_SHOW = "+237 698 636 766";
var T = {
  fr:{other:"EN",cap:"Présentation · 23 s",pill:"Rendez-vous",title:"Prenons <em>rendez-vous</em>",
    sub:"Écris ton nom et choisis un créneau. Ta demande s'ouvre dans WhatsApp, prête à être envoyée.",
    name:"Nom et prénom",date:"Date",time:"Heure",msg:"Message (facultatif)",send:"Envoyer sur WhatsApp",
    err:"Renseigne ton nom, la date et l'heure.",helpTxt:"Numéro WhatsApp :",copy:"Copier",copied:"Copié",
    ask:"Une question ? Je suis là.",on:"♪ Musique",off:"♪ Coupée",
    wa:function(n,d,t,m){return "Bonjour, je m'appelle "+n+". Je souhaite prendre rendez-vous le "+d+" à "+t+"."+(m?"\n\nMessage : "+m:"");}},
  en:{other:"FR",cap:"Introduction · 27 s",pill:"Appointment",title:"Let's <em>book a meeting</em>",
    sub:"Enter your name and pick a time. Your request opens in WhatsApp, ready to send.",
    name:"Full name",date:"Date",time:"Time",msg:"Message (optional)",send:"Send on WhatsApp",
    err:"Please enter your name, the date and the time.",helpTxt:"WhatsApp number:",copy:"Copy",copied:"Copied",
    ask:"Any question? I'm here.",on:"♪ Music",off:"♪ Muted",
    wa:function(n,d,t,m){return "Hello, my name is "+n+". I would like to book an appointment on "+d+" at "+t+"."+(m?"\n\nMessage: "+m:"");}}
};
var L = ((navigator.language||"fr").slice(0,2)==="en") ? "en" : "fr";
var playing=false, ctx, master, timer, step=0;
var $ = function(id){return document.getElementById(id);};

function link(){
  var n=$("name").value.trim(), d=$("date").value, t=$("time").value, m=$("msg").value.trim();
  if(!n||!d||!t) return null;
  var ds=new Date(d+"T00:00").toLocaleDateString(L==="fr"?"fr-FR":"en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  return "https://wa.me/"+WA+"?text="+encodeURIComponent(T[L].wa(n,ds,t,m));
}
function refresh(){ var u=link(); $("send").href=u||"#"; if(u) $("err").textContent=""; }

function render(){
  var t=T[L]; document.documentElement.lang=L;
  $("lang").textContent=t.other; $("cap").textContent=t.cap; $("pill").textContent=t.pill; $("title").innerHTML=t.title;
  $("sub").textContent=t.sub; $("lName").textContent=t.name; $("lDate").textContent=t.date; $("lTime").textContent=t.time;
  $("lMsg").textContent=t.msg; $("send").textContent=t.send; $("helpTxt").textContent=t.helpTxt; $("copy").textContent=t.copy;
  $("ask").textContent=t.ask; $("music").textContent=playing?t.on:t.off; refresh();
}
function setVideo(){
  var v=$("vid"), src="Arthur_Mandio_"+L+".mp4";
  if(v.getAttribute("src")!==src){ v.pause(); v.setAttribute("src",src); v.load(); }
}

/* Musique douce de salle d'attente, synthétisée dans la page */
var CH=[[261.63,329.63,392,493.88],[220,261.63,329.63,392],[174.61,261.63,329.63,440],[196,246.94,293.66,392]];
function pad(fr){
  var now=ctx.currentTime;
  fr.forEach(function(f,i){
    var o=ctx.createOscillator(),g=ctx.createGain(),lp=ctx.createBiquadFilter();
    o.type="triangle"; o.frequency.value=f/(i===0?2:1); o.detune.value=(i-1.5)*4;
    lp.type="lowpass"; lp.frequency.value=900;
    g.gain.setValueAtTime(0,now); g.gain.linearRampToValueAtTime(.05,now+1.2); g.gain.linearRampToValueAtTime(0,now+4.8);
    o.connect(lp); lp.connect(g); g.connect(master); o.start(now); o.stop(now+5);
  });
}
function startMusic(){
  try{
    if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)(); master=ctx.createGain(); master.gain.value=.8; master.connect(ctx.destination);}
    if(ctx.state==="suspended") ctx.resume();
    $("vid").pause(); playing=true; pad(CH[step++%4]); timer=setInterval(function(){pad(CH[step++%4]);},4000);
  }catch(e){playing=false;}
  render();
}
function stopMusic(){playing=false; clearInterval(timer); render();}

$("music").onclick=function(){playing?stopMusic():startMusic();};
$("lang").onclick=function(){L=(L==="fr")?"en":"fr"; setVideo(); render();};
$("vid").addEventListener("play",function(){ if(playing) stopMusic(); });
["name","date","time","msg"].forEach(function(id){$(id).addEventListener("input",refresh);});
$("date").min=new Date().toISOString().slice(0,10);
$("send").addEventListener("click",function(e){
  if(!link()){ e.preventDefault(); $("err").textContent=T[L].err; }
});
$("copy").onclick=function(){
  var done=function(){ $("copy").textContent=T[L].copied; setTimeout(function(){$("copy").textContent=T[L].copy;},1500); };
  try{ navigator.clipboard.writeText("+237698636766").then(done,function(){ var r=document.createRange(); r.selectNodeContents($("num")); var s=getSelection(); s.removeAllRanges(); s.addRange(r); }); }
  catch(e){ var r=document.createRange(); r.selectNodeContents($("num")); var s=getSelection(); s.removeAllRanges(); s.addRange(r); }
};
setVideo(); render();
</script>
</body>
</html>
